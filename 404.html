<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <link rel="preload" href="/fonts/江城黑体900W-subset.ttf" as="font" type="font/ttf" crossorigin />
  <title>404 - 页面未找到 | 广州实验中学</title>
  <link rel="stylesheet" href="/style.css?v=28" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .error-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .error-code {
      font-family: '江城黑体900W', '字魂59号创粗黑', sans-serif;
      font-size: clamp(120px, 25vw, 200px);
      font-weight: 900;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -5px;
    }
    .error-title {
      font-family: '江城黑体900W', '字魂59号创粗黑', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--color-text);
      margin-bottom: 15px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--color-text-secondary);
      margin-bottom: 40px;
      max-width: 400px;
      line-height: 1.6;
    }
    .error-btn {
      display: inline-block;
      padding: 14px 40px;
      background: var(--color-primary);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
    }
    .error-btn:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 33, 91, 0.3);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <!-- 校标头部 -->
    <header class="brand-header scrolled">
      <a href="/" class="brand">
        <img src="/images/校标修改.svg" alt="广州实验中学徽标" />
        <div class="brand-text">
          <span class="brand-name">广州实验中学</span>
          <span class="brand-ename">GUANGZHOU EXPERIMENTAL SECONDARY SCHOOL</span>
        </div>
      </a>
    </header>

    <!-- 404内容 -->
    <main class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">页面未找到</h1>
      <p class="error-desc">抱歉，您访问的页面不存在或已被移动。请检查网址是否正确，或返回首页继续浏览。</p>
      <a href="/" class="error-btn">返回首页</a>
    </main>

    <!-- 页脚 -->
    <footer>
      <div class="footer-content">
        <div class="footer-brand">
          <img src="/images/校标修改.svg" alt="校徽" />
          <div class="footer-brand-text">
            <h3>广州实验中学</h3>
            <p>广州市教育局与黄埔区人民政府共建</p>
            <p>公办完全中学 · 广东省义务教育标准化学校</p>
          </div>
        </div>
        <div class="footer-col">
          <h4>快速导航</h4>
          <a href="/">首页</a>
          <a href="/about/">学校简介</a>
          <a href="/condition/">办学条件</a>
          <a href="/philosophy/">办学理念</a>
        </div>
        <div class="footer-col">
          <h4>联系我们</h4>
          <p>广州市黄埔区修业路6号</p>
          <p>公办完全中学</p>
          <p>创办于2021年</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2025 广州实验中学 版权所有 | 校训：研精覃思 循真至美</p>
      </div>
    </footer>
  </div>
</body>
</html>
