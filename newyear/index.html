<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新春快乐 - 广州实验中学</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      background: linear-gradient(180deg, #8B0000 0%, #C8102E 50%, #8B0000 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #FFD700;
      position: relative;
    }

    /* 烟花画布 */
    #fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 金色粒子飘落 */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #FFD700;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: fall linear infinite;
      box-shadow: 0 0 6px #FFD700;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0.3; }
    }

    /* 灯笼 */
    .lantern {
      position: absolute;
      width: 70px;
      height: 90px;
      z-index: 3;
      animation: swing 3s ease-in-out infinite;
      transform-origin: top center;
    }

    .lantern.left { top: 20px; left: 8%; }
    .lantern.right { top: 20px; right: 8%; animation-delay: -1.5s; }

    .lantern-body {
      width: 70px;
      height: 80px;
      background: radial-gradient(circle at 30% 30%, #FF4444, #C8102E 60%, #8B0000);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 30px rgba(255, 100, 50, 0.6), inset 0 0 20px rgba(255, 200, 0, 0.3);
    }

    .lantern-body::before {
      content: '福';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFD700;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .lantern-top {
      width: 30px;
      height: 8px;
      background: #FFD700;
      margin: 0 auto;
      border-radius: 3px 3px 0 0;
    }

    .lantern-bottom {
      width: 20px;
      height: 15px;
      background: linear-gradient(180deg, #FFD700, #DAA520);
      margin: 0 auto;
      border-radius: 0 0 5px 5px;
      position: relative;
    }

    .lantern-tassel {
      width: 3px;
      height: 25px;
      background: linear-gradient(180deg, #FFD700, #FF4500);
      margin: 0 auto;
    }

    @keyframes swing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* 主内容 */
    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      text-align: center;
    }

    .school-name {
      font-size: 1.5rem;
      color: #FFD700;
      letter-spacing: 8px;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      opacity: 0;
      animation: fadeInDown 1s ease 0.3s forwards;
    }

    .main-title {
      font-size: clamp(3rem, 10vw, 6rem);
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 4px 8px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      letter-spacing: 10px;
      opacity: 0;
      animation: fadeInDown 1s ease 0.6s forwards;
      font-weight: bold;
    }

    .sub-title {
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: #FFE4B5;
      letter-spacing: 6px;
      margin-bottom: 50px;
      opacity: 0;
      animation: fadeInDown 1s ease 0.9s forwards;
    }

    /* 大福字 */
    .fu-container {
      width: clamp(150px, 40vw, 250px);
      height: clamp(150px, 40vw, 250px);
      background: linear-gradient(135deg, #C8102E, #8B0000);
      border: 4px solid #FFD700;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      margin: 30px 0;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.4), inset 0 0 30px rgba(255, 215, 0, 0.1);
      opacity: 0;
      animation: fuAppear 1s ease 1.2s forwards;
      position: relative;
    }

    .fu-container::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 8px;
    }

    .fu-char {
      font-size: clamp(5rem, 15vw, 9rem);
      color: #FFD700;
      transform: rotate(-45deg);
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }

    @keyframes fuAppear {
      0% { opacity: 0; transform: rotate(45deg) scale(0.3); }
      100% { opacity: 1; transform: rotate(45deg) scale(1); }
    }

    /* 春联 */
    .couplet {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      background: linear-gradient(180deg, #C8102E, #8B0000);
      border: 2px solid #FFD700;
      border-radius: 5px;
      padding: 20px 8px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 1.1rem;
      color: #FFD700;
      letter-spacing: 10px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      z-index: 5;
    }

    .couplet.left { left: 3%; }
    .couplet.right { right: 3%; }

    @media (max-width: 768px) {
      .couplet { display: none; }
    }

    /* 祝福文字 */
    .blessing {
      margin-top: 50px;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #FFE4B5;
      line-height: 2.2;
      max-width: 600px;
      opacity: 0;
      animation: fadeInUp 1s ease 1.5s forwards;
    }

    .blessing p {
      margin-bottom: 10px;
    }

    /* 倒计时 */
    .countdown-box {
      margin-top: 40px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #FFD700;
      border-radius: 15px;
      padding: 25px 40px;
      opacity: 0;
      animation: fadeInUp 1s ease 1.8s forwards;
    }

    .countdown-label {
      font-size: 1rem;
      color: #FFE4B5;
      margin-bottom: 15px;
      letter-spacing: 3px;
    }

    .countdown-time {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      color: #FFD700;
      font-weight: bold;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      font-family: "DIN", "Arial", sans-serif;
    }

    .countdown-unit {
      font-size: 0.9rem;
      color: #FFE4B5;
      margin-left: 5px;
    }

    /* 返回按钮 */
    .back-btn {
      margin-top: 50px;
      padding: 15px 50px;
      background: linear-gradient(135deg, #FFD700, #DAA520);
      color: #8B0000;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 3px;
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
      transition: all 0.3s;
      opacity: 0;
      animation: fadeInUp 1s ease 2.1s forwards;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6);
    }

    /* 底部 */
    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255, 228, 181, 0.6);
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeInUp 1s ease 2.4s forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 鞭炮装饰 */
    .firecracker {
      position: absolute;
      width: 20px;
      height: 60px;
      background: linear-gradient(180deg, #FF4500, #C8102E);
      border-radius: 3px;
      z-index: 4;
    }

    .firecracker::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 15px;
      background: #8B4513;
    }

    .firecracker::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 8px;
      background: #FFD700;
      border-radius: 0 0 3px 3px;
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>

  <!-- 灯笼 -->
  <div class="lantern left">
    <div class="lantern-top"></div>
    <div class="lantern-body"></div>
    <div class="lantern-bottom"><div class="lantern-tassel"></div></div>
  </div>
  <div class="lantern right">
    <div class="lantern-top"></div>
    <div class="lantern-body"></div>
    <div class="lantern-bottom"><div class="lantern-tassel"></div></div>
  </div>

  <!-- 春联 -->
  <div class="couplet left">研精覃思育桃李</div>
  <div class="couplet right">循真至美铸辉煌</div>

  <div class="container">
    <div class="school-name">广州实验中学</div>
    <h1 class="main-title">新春快乐</h1>
    <div class="sub-title">蛇年大吉 · 万事如意</div>

    <div class="fu-container">
      <div class="fu-char">福</div>
    </div>

    <div class="blessing">
      <p>值此新春佳节之际</p>
      <p>广州实验中学全体师生</p>
      <p>祝您阖家幸福 · 身体健康 · 学业进步</p>
      <p>新的一年，研精覃思，循真至美</p>
    </div>

    <div class="countdown-box">
      <div class="countdown-label">距离农历新年</div>
      <div class="countdown-time" id="countdown">--</div>
    </div>

    <a href="/" class="back-btn">返回首页</a>

    <div class="footer">© 2025 广州实验中学 · 新春限定版</div>
  </div>

  <script>
    // 金色粒子飘落
    function createParticles() {
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 5 + 5) + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
        document.body.appendChild(p);
      }
    }
    createParticles();

    // 烟花效果
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = ['#FFD700', '#FF4500', '#FF6347', '#FFE4B5', '#FFA500', '#FF1493'];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.01;
        this.size = Math.random() * 3 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5 + 50;
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 80; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(139, 0, 0, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();

    setInterval(createFirework, 1500);
    setTimeout(createFirework, 500);
    setTimeout(createFirework, 1000);

    // 春节倒计时（2026年春节是2月17日）
    function updateCountdown() {
      const now = new Date();
      const year = now.getFullYear();
      let springFestival = new Date(year, 1, 17); // 2月17日
      if (now > springFestival) {
        springFestival = new Date(year + 1, 1, 17);
      }
      const diff = springFestival - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

      const el = document.getElementById('countdown');
      if (days > 0) {
        el.innerHTML = days + '<span class="countdown-unit">天</span> ' +
          hours + '<span class="countdown-unit">时</span> ' +
          minutes + '<span class="countdown-unit">分</span>';
      } else if (hours > 0) {
        el.innerHTML = hours + '<span class="countdown-unit">时</span> ' +
          minutes + '<span class="countdown-unit">分</span>';
      } else {
        el.innerHTML = minutes + '<span class="countdown-unit">分</span>';
      }
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>
</body>
</html>
