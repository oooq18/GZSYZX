<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM TERMINAL</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0b09;
      --bg2: #141210;
      --panel: rgba(20, 18, 15, 0.92);
      --panel-solid: #181613;
      --border: #3a352e;
      --border-light: #4a443c;
      --accent: #d4a054;
      --accent-bright: #e8b860;
      --accent-dim: #8a6d3a;
      --text: #e0d8c8;
      --text-dim: #8a8275;
      --text-faint: #5a544a;
      --ok: #7ab06a;
      --warn: #c9903a;
      --danger: #b85a4a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(212, 160, 84, 0.015) 2px, rgba(212, 160, 84, 0.015) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(212, 160, 84, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 160, 84, 0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: var(--bg);
    }

    .login-box {
      text-align: center;
      position: relative;
      padding: 70px 90px;
    }

    .login-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--accent-bright);
      font-size: 2.2rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 14px;
      text-align: center;
      width: 220px;
      outline: none;
      padding: 12px 0;
      transition: border-color 0.3s;
      caret-color: var(--accent);
    }
    .login-input:focus { border-bottom-color: var(--accent); }
    .login-input.error {
      border-bottom-color: var(--danger);
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .login-hint {
      margin-top: 35px;
      font-size: 0.65rem;
      color: var(--danger);
      letter-spacing: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .login-hint.show { opacity: 1; }

    #mainInterface {
      display: none;
      position: relative;
      z-index: 2;
      padding: 30px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .top-bar-left { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 38px; height: 38px;
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .top-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-bright);
      letter-spacing: 3px;
    }
    .top-subtitle {
      font-size: 0.65rem;
      color: var(--text-faint);
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .top-bar-right {
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      line-height: 1.8;
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--ok);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      margin-bottom: 22px;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .panel::before, .panel::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--accent-dim);
      border-style: solid;
    }
    .panel::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .panel::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(212, 160, 84, 0.03);
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }
    .panel-title::before {
      content: '▸';
      color: var(--accent-dim);
      font-size: 0.7rem;
    }
    .panel-badge {
      font-size: 0.65rem;
      padding: 2px 8px;
      border: 1px solid;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 1px;
    }
    .panel-badge.ok { color: var(--ok); border-color: var(--ok); background: rgba(122,176,106,0.08); }
    .panel-badge.warn { color: var(--warn); border-color: var(--warn); background: rgba(201,144,58,0.08); }
    .panel-badge.danger { color: var(--danger); border-color: var(--danger); background: rgba(184,90,74,0.08); }

    .panel-body { padding: 18px; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .wue-btn {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .wue-btn:hover {
      border-color: var(--accent);
      color: var(--accent-bright);
      background: rgba(212, 160, 84, 0.06);
    }
    .wue-btn.danger { border-color: rgba(184,90,74,0.4); color: var(--danger); }
    .wue-btn.danger:hover { border-color: var(--danger); background: rgba(184,90,74,0.08); }
    .wue-btn.warn { border-color: rgba(201,144,58,0.4); color: var(--warn); }
    .wue-btn.warn:hover { border-color: var(--warn); background: rgba(201,144,58,0.08); }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(58,53,46,0.5);
      font-size: 0.8rem;
    }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: var(--text-dim); letter-spacing: 1px; }
    .data-value { color: var(--accent); font-family: 'Share Tech Mono', monospace; }

    .news-entry {
      padding: 12px 14px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      background: rgba(0,0,0,0.2);
      position: relative;
    }
    .news-entry::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent-dim);
    }
    .news-entry-title {
      color: var(--text);
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
      padding-left: 8px;
    }
    .news-entry-meta {
      font-size: 0.7rem;
      color: var(--text-faint);
      padding-left: 8px;
      font-family: 'Share Tech Mono', monospace;
    }
    .news-entry-desc {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 6px;
      padding-left: 8px;
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 35px;
      color: var(--text-faint);
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .cache-entry {
      padding: 10px 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: rgba(0,0,0,0.2);
    }
    .cache-key {
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .cache-value {
      color: var(--text-dim);
      font-size: 0.7rem;
      font-family: 'Share Tech Mono', monospace;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .toast {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-solid);
      border: 1px solid var(--accent);
      color: var(--accent-bright);
      padding: 10px 26px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .bottom-bar {
      margin-top: 25px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-faint);
      font-family: 'Share Tech Mono', monospace;
    }

    a.back-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
    a.back-link:hover { color: var(--accent); }

    @media (max-width: 600px) {
      #mainInterface { padding: 15px; }
      .login-box { padding: 50px 30px; }
      .login-input { font-size: 1.6rem; width: 170px; letter-spacing: 10px; }
      .panel-body { padding: 14px; }
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <input type="password" class="login-input" id="passInput" maxlength="6" autocomplete="off" autofocus>
      <div class="login-hint" id="loginHint">验证失败</div>
    </div>
  </div>

  <div id="mainInterface">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="logo-mark">UEG</div>
        <div>
          <div class="top-title">缓存控制终端</div>
          <div class="top-subtitle">广州实验中学</div>
        </div>
      </div>
      <div class="top-bar-right">
        <div><span class="status-dot"></span>系统在线</div>
        <div id="clockDisplay">--:--:--</div>
      </div>
    </div>

    <a href="/" class="back-link">← 返回首页</a>

    <div class="panel" style="margin-top: 18px;">
      <div class="panel-header">
        <div class="panel-title">新闻缓存</div>
        <span class="panel-badge" id="newsBadge">检查中</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn warn" onclick="clearNewsCache()">清除新闻</button>
          <button class="wue-btn" onclick="refreshNews()">刷新</button>
        </div>
        <div id="newsContent"><div class="empty-state">加载中...</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">服务工作进程</div>
        <span class="panel-badge" id="swBadge">检查中</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn danger" onclick="clearSWCache()">清除全部缓存</button>
          <button class="wue-btn warn" onclick="unregisterSW()">注销服务</button>
          <button class="wue-btn" onclick="refreshSW()">刷新</button>
        </div>
        <div id="swContent"><div class="empty-state">加载中...</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">本地存储</div>
        <span class="panel-badge" id="lsBadge">0 项</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn danger" onclick="clearAllLS()">清除全部</button>
          <button class="wue-btn" onclick="refreshLS()">刷新</button>
        </div>
        <div id="lsContent"><div class="empty-state">加载中...</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">系统诊断</div>
        <span class="panel-badge" id="diagBadge">正常</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn" onclick="runDiagnostics()">运行诊断</button>
          <button class="wue-btn warn" onclick="location.reload()">强制刷新页面</button>
        </div>
        <div id="diagContent"><div class="empty-state">点击"运行诊断"检查系统状态</div></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div>UEG 缓存系统 v1.0</div>
      <div>构建: 2026.09.07</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const _k = 0x1F;
    const _p = atob('LyYvJi8m');

    function checkPass(input) {
      if (input.length !== 6) return false;
      let enc = '';
      for (let i = 0; i < input.length; i++) {
        enc += String.fromCharCode(input.charCodeAt(i) ^ _k);
      }
      return enc === _p;
    }

    const passInput = document.getElementById('passInput');
    const loginHint = document.getElementById('loginHint');
    passInput.value = '';

    passInput.addEventListener('input', (e) => {
      if (e.target.value.length === 6) {
        if (checkPass(e.target.value)) {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('mainInterface').style.display = 'block';
          initTerminal();
        } else {
          passInput.classList.add('error');
          loginHint.classList.add('show');
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        }
      }
    });

    function updateClock() {
      const n = new Date();
      document.getElementById('clockDisplay').textContent =
        String(n.getHours()).padStart(2,'0') + ':' +
        String(n.getMinutes()).padStart(2,'0') + ':' +
        String(n.getSeconds()).padStart(2,'0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    const NEWS_KEY = 'gzsyzx_news_cache';
    const CACHE_TTL = 30 * 60 * 1000;

    function formatTime(ts) {
      if (!ts) return '未知';
      return new Date(ts).toLocaleString('zh-CN');
    }

    function refreshNews() {
      const badge = document.getElementById('newsBadge');
      const content = document.getElementById('newsContent');
      let cache = null;
      try {
        const raw = localStorage.getItem(NEWS_KEY);
        if (raw) cache = JSON.parse(raw);
      } catch(e) {
        content.innerHTML = '<div class="empty-state" style="color:var(--danger);">缓存解析失败: ' + e.message + '</div>';
        badge.textContent = '错误';
        badge.className = 'panel-badge danger';
        return;
      }

      if (!cache || !cache.articles || cache.articles.length === 0) {
        badge.textContent = '空';
        badge.className = 'panel-badge danger';
        content.innerHTML = '<div class="empty-state">无新闻缓存<br><span style="font-size:0.7rem;">请先访问首页加载新闻</span></div>';
        return;
      }

      const age = Date.now() - (cache.time || 0);
      if (age < CACHE_TTL) { badge.textContent = '新鲜'; badge.className = 'panel-badge ok'; }
      else if (age < CACHE_TTL * 2) { badge.textContent = '已过期'; badge.className = 'panel-badge warn'; }
      else { badge.textContent = '过期'; badge.className = 'panel-badge danger'; }

      let html = '<div class="data-row"><span class="data-label">缓存时间</span><span class="data-value">' + formatTime(cache.time) + '</span></div>';
      html += '<div class="data-row"><span class="data-label">文章数量</span><span class="data-value">' + cache.articles.length + '</span></div>';
      html += '<div style="height:12px;"></div>';

      cache.articles.forEach((item, i) => {
        html += '<div class="news-entry">';
        html += '<div class="news-entry-title">[' + (i+1) + '] ' + (item.title || '无标题') + '</div>';
        html += '<div class="news-entry-meta">';
        if (item.date) html += '发布: ' + item.date + ' | ';
        if (item.link) html += '<a href="' + item.link + '" target="_blank" style="color:var(--accent-dim);">查看原文</a>';
        html += '</div>';
        if (item.desc) {
          html += '<div class="news-entry-desc">' + item.desc.substring(0, 120) + (item.desc.length > 120 ? '...' : '') + '</div>';
        }
        html += '</div>';
      });
      content.innerHTML = html;
    }

    function clearNewsCache() {
      localStorage.removeItem(NEWS_KEY);
      showToast('新闻缓存已清除');
      refreshNews();
      refreshLS();
    }

    async function refreshSW() {
      const badge = document.getElementById('swBadge');
      const content = document.getElementById('swContent');

      if (!('serviceWorker' in navigator)) {
        badge.textContent = '不支持';
        badge.className = 'panel-badge danger';
        content.innerHTML = '<div class="empty-state">浏览器不支持服务工作进程</div>';
        return;
      }

      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs.length === 0) {
        badge.textContent = '未激活';
        badge.className = 'panel-badge warn';
        content.innerHTML = '<div class="empty-state">服务未注册</div>';
        return;
      }

      badge.textContent = '已激活';
      badge.className = 'panel-badge ok';

      let html = '';
      regs.forEach((reg, i) => {
        html += '<div class="data-row"><span class="data-label">服务 #' + (i+1) + ' 状态</span><span class="data-value">' + (reg.active ? '运行中' : '等待中') + '</span></div>';
        html += '<div class="data-row"><span class="data-label">作用域</span><span class="data-value" style="font-size:0.65rem;">' + reg.scope + '</span></div>';
      });

      if ('caches' in window) {
        const keys = await caches.keys();
        html += '<div class="data-row"><span class="data-label">缓存版本</span><span class="data-value">' + keys.length + '</span></div>';
        for (const key of keys) {
          const cache = await caches.open(key);
          const reqs = await cache.keys();
          html += '<div class="data-row"><span class="data-label">└ ' + key + '</span><span class="data-value">' + reqs.length + ' 个资源</span></div>';
        }
      }
      content.innerHTML = html;
    }

    async function clearSWCache() {
      if (!confirm('确定清除全部静态缓存？')) return;
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
      }
      showToast('全部缓存已清除');
      refreshSW();
    }

    async function unregisterSW() {
      if (!confirm('确定注销服务工作进程？')) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      showToast('服务已注销');
      refreshSW();
    }

    function refreshLS() {
      const badge = document.getElementById('lsBadge');
      const content = document.getElementById('lsContent');
      badge.textContent = localStorage.length + ' 项';

      if (localStorage.length === 0) {
        content.innerHTML = '<div class="empty-state">无数据</div>';
        return;
      }

      let html = '';
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        let display = val;
        try { display = JSON.stringify(JSON.parse(val), null, 2); } catch(e) {}
        html += '<div class="cache-entry">';
        html += '<div class="cache-key">' + key + '</div>';
        html += '<div class="cache-value">' + display.substring(0, 1500) + (display.length > 1500 ? '\n...已截断' : '') + '</div>';
        html += '</div>';
      }
      content.innerHTML = html;
    }

    function clearAllLS() {
      if (!confirm('确定清除全部本地存储？')) return;
      localStorage.clear();
      showToast('本地存储已清除');
      refreshNews();
      refreshLS();
    }

    function runDiagnostics() {
      const badge = document.getElementById('diagBadge');
      const content = document.getElementById('diagContent');
      let html = '';
      let hasError = false;

      // 1. 检查localStorage
      html += '<div class="data-row"><span class="data-label">localStorage 可用</span><span class="data-value">' + (typeof localStorage !== 'undefined' ? '是' : '否') + '</span></div>';
      html += '<div class="data-row"><span class="data-label">localStorage 条目数</span><span class="data-value">' + localStorage.length + '</span></div>';

      // 2. 列出所有key
      html += '<div style="height:10px;"></div>';
      html += '<div class="data-label" style="margin-bottom:8px;">所有存储键：</div>';
      if (localStorage.length === 0) {
        html += '<div class="empty-state" style="padding:15px;">无任何存储</div>';
      } else {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          const val = localStorage.getItem(key);
          html += '<div class="cache-entry">';
          html += '<div class="cache-key">' + key + '</div>';
          html += '<div class="cache-value">长度: ' + val.length + ' 字符 | 前200字符: ' + val.substring(0, 200) + '</div>';
          html += '</div>';
        }
      }

      // 3. 检查新闻缓存
      html += '<div style="height:10px;"></div>';
      const raw = localStorage.getItem('gzsyzx_news_cache');
      html += '<div class="data-row"><span class="data-label">新闻缓存原始值</span><span class="data-value">' + (raw ? '存在 (' + raw.length + '字符)' : '不存在') + '</span></div>';
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          html += '<div class="data-row"><span class="data-label">JSON解析</span><span class="data-value" style="color:var(--ok);">成功</span></div>';
          html += '<div class="data-row"><span class="data-label">articles字段</span><span class="data-value">' + (parsed.articles ? '存在 (' + parsed.articles.length + '篇)' : '不存在') + '</span></div>';
          html += '<div class="data-row"><span class="data-label">time字段</span><span class="data-value">' + (parsed.time ? parsed.time + ' (' + new Date(parsed.time).toLocaleString() + ')' : '不存在') + '</span></div>';
        } catch(e) {
          hasError = true;
          html += '<div class="data-row"><span class="data-label">JSON解析</span><span class="data-value" style="color:var(--danger);">失败: ' + e.message + '</span></div>';
        }
      }

      // 4. 检查Service Worker
      html += '<div style="height:10px;"></div>';
      html += '<div class="data-row"><span class="data-label">Service Worker 支持</span><span class="data-value">' + ('serviceWorker' in navigator ? '是' : '否') + '</span></div>';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          const swInfo = document.getElementById('swDiagInfo');
          if (swInfo) swInfo.textContent = regs.length + ' 个已注册';
        });
      }

      // 5. 检查当前页面URL
      html += '<div style="height:10px;"></div>';
      html += '<div class="data-row"><span class="data-label">当前页面URL</span><span class="data-value" style="font-size:0.65rem;word-break:break-all;">' + window.location.href + '</span></div>';
      html += '<div class="data-row"><span class="data-label">当前源(origin)</span><span class="data-value" style="font-size:0.65rem;">' + window.location.origin + '</span></div>';
      html += '<div class="data-row"><span class="data-label">协议</span><span class="data-value">' + window.location.protocol + '</span></div>';

      if (hasError) {
        badge.textContent = '有错误';
        badge.className = 'panel-badge danger';
      } else {
        badge.textContent = '正常';
        badge.className = 'panel-badge ok';
      }
      content.innerHTML = html;
    }

    // 全局错误捕获
    window.addEventListener('error', function(e) {
      console.error('页面错误:', e.message, e.filename, e.lineno);
    });

    function initTerminal() {
      refreshNews();
      refreshSW();
      refreshLS();
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
