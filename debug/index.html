<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM TERMINAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --wue-bg: #0a0e1a;
      --wue-bg2: #0d1424;
      --wue-panel: rgba(13, 20, 36, 0.85);
      --wue-border: #1a3a5c;
      --wue-cyan: #00d4ff;
      --wue-cyan-dim: #0088aa;
      --wue-blue: #2a6bb5;
      --wue-text: #c8e0f0;
      --wue-text-dim: #5a7a9a;
      --wue-warn: #ffaa00;
      --wue-danger: #ff4444;
      --wue-ok: #00ff88;
    }

    body {
      background: var(--wue-bg);
      color: var(--wue-text);
      font-family: 'Rajdhani', 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 扫描线背景 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 212, 255, 0.02) 2px,
        rgba(0, 212, 255, 0.02) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 网格背景 */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== 登录界面 ===== */
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: var(--wue-bg);
    }

    .login-box {
      text-align: center;
      position: relative;
      padding: 60px 80px;
    }

    .login-box::before,
    .login-box::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: var(--wue-cyan);
      border-style: solid;
    }

    .login-box::before {
      top: 0;
      left: 0;
      border-width: 2px 0 0 2px;
    }

    .login-box::after {
      bottom: 0;
      right: 0;
      border-width: 0 2px 2px 0;
    }

    .login-title {
      font-size: 0.8rem;
      letter-spacing: 8px;
      color: var(--wue-cyan-dim);
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .login-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--wue-border);
      color: var(--wue-cyan);
      font-size: 2rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 12px;
      text-align: center;
      width: 200px;
      outline: none;
      padding: 10px 0;
      transition: border-color 0.3s;
    }

    .login-input:focus {
      border-bottom-color: var(--wue-cyan);
      box-shadow: 0 4px 20px -8px var(--wue-cyan);
    }

    .login-input.error {
      border-bottom-color: var(--wue-danger);
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .login-hint {
      margin-top: 30px;
      font-size: 0.7rem;
      color: var(--wue-text-dim);
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .login-hint.show {
      opacity: 1;
    }

    /* ===== 主界面 ===== */
    #mainInterface {
      display: none;
      position: relative;
      z-index: 2;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--wue-border);
      margin-bottom: 30px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border: 1px solid var(--wue-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--wue-cyan);
      font-weight: 700;
    }

    .top-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--wue-cyan);
      letter-spacing: 3px;
    }

    .top-subtitle {
      font-size: 0.7rem;
      color: var(--wue-text-dim);
      letter-spacing: 2px;
    }

    .top-bar-right {
      text-align: right;
      font-size: 0.75rem;
      color: var(--wue-text-dim);
      font-family: 'Share Tech Mono', monospace;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--wue-ok);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 面板 */
    .panel {
      background: var(--wue-panel);
      border: 1px solid var(--wue-border);
      margin-bottom: 24px;
      position: relative;
      backdrop-filter: blur(10px);
    }

    .panel::before,
    .panel::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      border-color: var(--wue-cyan);
      border-style: solid;
    }

    .panel::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .panel::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--wue-border);
      background: rgba(0, 212, 255, 0.03);
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--wue-cyan);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title::before {
      content: '▸';
      color: var(--wue-cyan);
    }

    .panel-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border: 1px solid;
      border-radius: 2px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 1px;
    }

    .panel-badge.ok {
      color: var(--wue-ok);
      border-color: var(--wue-ok);
      background: rgba(0, 255, 136, 0.1);
    }

    .panel-badge.warn {
      color: var(--wue-warn);
      border-color: var(--wue-warn);
      background: rgba(255, 170, 0, 0.1);
    }

    .panel-badge.danger {
      color: var(--wue-danger);
      border-color: var(--wue-danger);
      background: rgba(255, 68, 68, 0.1);
    }

    .panel-body {
      padding: 20px;
    }

    /* 按钮 */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .wue-btn {
      padding: 10px 22px;
      background: transparent;
      border: 1px solid var(--wue-border);
      color: var(--wue-text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      text-transform: uppercase;
    }

    .wue-btn:hover {
      border-color: var(--wue-cyan);
      color: var(--wue-cyan);
      background: rgba(0, 212, 255, 0.08);
      box-shadow: 0 0 20px -5px var(--wue-cyan);
    }

    .wue-btn.danger {
      border-color: rgba(255, 68, 68, 0.4);
      color: var(--wue-danger);
    }

    .wue-btn.danger:hover {
      border-color: var(--wue-danger);
      background: rgba(255, 68, 68, 0.1);
      box-shadow: 0 0 20px -5px var(--wue-danger);
    }

    .wue-btn.warn {
      border-color: rgba(255, 170, 0, 0.4);
      color: var(--wue-warn);
    }

    .wue-btn.warn:hover {
      border-color: var(--wue-warn);
      background: rgba(255, 170, 0, 0.1);
      box-shadow: 0 0 20px -5px var(--wue-warn);
    }

    /* 数据项 */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(26, 58, 92, 0.5);
      font-size: 0.85rem;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-label {
      color: var(--wue-text-dim);
      letter-spacing: 1px;
    }

    .data-value {
      color: var(--wue-cyan);
      font-family: 'Share Tech Mono', monospace;
    }

    /* 新闻条目 */
    .news-entry {
      padding: 14px;
      border: 1px solid var(--wue-border);
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .news-entry::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--wue-cyan);
    }

    .news-entry-title {
      color: var(--wue-text);
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      padding-left: 10px;
    }

    .news-entry-meta {
      font-size: 0.75rem;
      color: var(--wue-text-dim);
      padding-left: 10px;
      font-family: 'Share Tech Mono', monospace;
    }

    .news-entry-desc {
      font-size: 0.8rem;
      color: var(--wue-text-dim);
      margin-top: 8px;
      padding-left: 10px;
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--wue-text-dim);
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    /* 缓存列表 */
    .cache-entry {
      padding: 12px;
      border: 1px solid var(--wue-border);
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.2);
    }

    .cache-key {
      color: var(--wue-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .cache-value {
      color: var(--wue-text-dim);
      font-size: 0.75rem;
      font-family: 'Share Tech Mono', monospace;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--wue-panel);
      border: 1px solid var(--wue-cyan);
      color: var(--wue-cyan);
      padding: 12px 30px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }

    /* 底部状态栏 */
    .bottom-bar {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid var(--wue-border);
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--wue-text-dim);
      font-family: 'Share Tech Mono', monospace;
    }

    a.back-link {
      color: var(--wue-cyan-dim);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    a.back-link:hover {
      color: var(--wue-cyan);
    }

    @media (max-width: 600px) {
      #mainInterface { padding: 15px; }
      .login-box { padding: 40px 30px; }
      .login-input { font-size: 1.5rem; width: 160px; }
      .panel-body { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- 登录界面 -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-title">SYSTEM ACCESS</div>
      <input type="password" class="login-input" id="passInput" maxlength="6" autocomplete="off" autofocus>
      <div class="login-hint" id="loginHint">ACCESS DENIED</div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainInterface">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="logo-mark">UEG</div>
        <div>
          <div class="top-title">CACHE CONTROL TERMINAL</div>
          <div class="top-subtitle">GUANGZHOU EXPERIMENTAL MIDDLE SCHOOL</div>
        </div>
      </div>
      <div class="top-bar-right">
        <div><span class="status-dot"></span>SYSTEM ONLINE</div>
        <div id="clockDisplay">--:--:--</div>
      </div>
    </div>

    <a href="/" class="back-link">← RETURN TO MAIN</a>

    <!-- 新闻缓存 -->
    <div class="panel" style="margin-top: 20px;">
      <div class="panel-header">
        <div class="panel-title">NEWS CACHE</div>
        <span class="panel-badge" id="newsBadge">CHECKING</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn warn" onclick="clearNewsCache()">PURGE NEWS</button>
          <button class="wue-btn" onclick="refreshNews()">REFRESH</button>
        </div>
        <div id="newsContent">
          <div class="empty-state">LOADING...</div>
        </div>
      </div>
    </div>

    <!-- Service Worker 缓存 -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">SERVICE WORKER</div>
        <span class="panel-badge" id="swBadge">CHECKING</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn danger" onclick="clearSWCache()">PURGE ALL CACHE</button>
          <button class="wue-btn warn" onclick="unregisterSW()">UNREGISTER SW</button>
          <button class="wue-btn" onclick="refreshSW()">REFRESH</button>
        </div>
        <div id="swContent">
          <div class="empty-state">LOADING...</div>
        </div>
      </div>
    </div>

    <!-- LocalStorage -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">LOCAL STORAGE</div>
        <span class="panel-badge" id="lsBadge">0 ITEMS</span>
      </div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="wue-btn danger" onclick="clearAllLS()">PURGE ALL</button>
          <button class="wue-btn" onclick="refreshLS()">REFRESH</button>
        </div>
        <div id="lsContent">
          <div class="empty-state">LOADING...</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div>UEG CACHE SYSTEM v1.0</div>
      <div id="buildInfo">BUILD: 2026.09.07</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 密码验证：加密存储，非明文
    // 验证逻辑：输入字符串每个字符charCode与密钥异或后比对
    const _k = 0x1F;
    const _p = atob('LyYvJi8m'); // 加密后的密码

    function checkPass(input) {
      if (input.length !== 6) return false;
      let enc = '';
      for (let i = 0; i < input.length; i++) {
        enc += String.fromCharCode(input.charCodeAt(i) ^ _k);
      }
      return enc === _p;
    }

    const passInput = document.getElementById('passInput');
    const loginHint = document.getElementById('loginHint');

    passInput.addEventListener('input', (e) => {
      if (e.target.value.length === 6) {
        if (checkPass(e.target.value)) {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('mainInterface').style.display = 'block';
          initTerminal();
        } else {
          passInput.classList.add('error');
          loginHint.classList.add('show');
          setTimeout(() => {
            passInput.value = '';
            passInput.classList.remove('error');
            loginHint.classList.remove('show');
          }, 800);
        }
      }
    });

    // 时钟
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = h + ':' + m + ':' + s;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    const NEWS_KEY = 'gzsyzx_news_cache';
    const CACHE_TTL = 30 * 60 * 1000;

    function formatTime(ts) {
      if (!ts) return 'UNKNOWN';
      return new Date(ts).toLocaleString('zh-CN');
    }

    // ===== 新闻缓存 =====
    function refreshNews() {
      const badge = document.getElementById('newsBadge');
      const content = document.getElementById('newsContent');
      let cache = null;
      try {
        cache = JSON.parse(localStorage.getItem(NEWS_KEY));
      } catch(e) {}

      if (!cache || !cache.articles || cache.articles.length === 0) {
        badge.textContent = 'EMPTY';
        badge.className = 'panel-badge danger';
        content.innerHTML = '<div class="empty-state">NO NEWS CACHE</div>';
        return;
      }

      const age = Date.now() - (cache.time || 0);
      if (age < CACHE_TTL) {
        badge.textContent = 'FRESH';
        badge.className = 'panel-badge ok';
      } else if (age < CACHE_TTL * 2) {
        badge.textContent = 'EXPIRED';
        badge.className = 'panel-badge warn';
      } else {
        badge.textContent = 'STALE';
        badge.className = 'panel-badge danger';
      }

      let html = '<div class="data-row"><span class="data-label">CACHE TIME</span><span class="data-value">' + formatTime(cache.time) + '</span></div>';
      html += '<div class="data-row"><span class="data-label">ARTICLES</span><span class="data-value">' + cache.articles.length + '</span></div>';
      html += '<div style="height:15px;"></div>';

      cache.articles.forEach((item, i) => {
        html += '<div class="news-entry">';
        html += '<div class="news-entry-title">[' + (i+1) + '] ' + (item.title || 'NO TITLE') + '</div>';
        html += '<div class="news-entry-meta">';
        if (item.pubDate) html += 'DATE: ' + item.pubDate + ' | ';
        if (item.link) html += '<a href="' + item.link + '" target="_blank" style="color:var(--wue-cyan-dim);">OPEN</a>';
        html += '</div>';
        if (item.description) {
          html += '<div class="news-entry-desc">' + item.description.substring(0, 120) + (item.description.length > 120 ? '...' : '') + '</div>';
        }
        html += '</div>';
      });

      content.innerHTML = html;
    }

    function clearNewsCache() {
      localStorage.removeItem(NEWS_KEY);
      showToast('NEWS CACHE PURGED');
      refreshNews();
      refreshLS();
    }

    // ===== Service Worker =====
    async function refreshSW() {
      const badge = document.getElementById('swBadge');
      const content = document.getElementById('swContent');

      if (!('serviceWorker' in navigator)) {
        badge.textContent = 'UNSUPPORTED';
        badge.className = 'panel-badge danger';
        content.innerHTML = '<div class="empty-state">SW NOT SUPPORTED</div>';
        return;
      }

      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs.length === 0) {
        badge.textContent = 'INACTIVE';
        badge.className = 'panel-badge warn';
        content.innerHTML = '<div class="empty-state">SW NOT REGISTERED</div>';
        return;
      }

      badge.textContent = 'ACTIVE';
      badge.className = 'panel-badge ok';

      let html = '';
      regs.forEach((reg, i) => {
        html += '<div class="data-row"><span class="data-label">SW #' + (i+1) + ' STATUS</span><span class="data-value">' + (reg.active ? 'RUNNING' : 'WAITING') + '</span></div>';
        html += '<div class="data-row"><span class="data-label">SCOPE</span><span class="data-value" style="font-size:0.7rem;">' + reg.scope + '</span></div>';
      });

      if ('caches' in window) {
        const keys = await caches.keys();
        html += '<div class="data-row"><span class="data-label">CACHE VERSIONS</span><span class="data-value">' + keys.length + '</span></div>';
        for (const key of keys) {
          const cache = await caches.open(key);
          const reqs = await cache.keys();
          html += '<div class="data-row"><span class="data-label">└ ' + key + '</span><span class="data-value">' + reqs.length + ' ASSETS</span></div>';
        }
      }

      content.innerHTML = html;
    }

    async function clearSWCache() {
      if (!confirm('PURGE ALL STATIC CACHE?')) return;
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
      }
      showToast('ALL CACHE PURGED');
      refreshSW();
    }

    async function unregisterSW() {
      if (!confirm('UNREGISTER SERVICE WORKER?')) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      showToast('SW UNREGISTERED');
      refreshSW();
    }

    // ===== LocalStorage =====
    function refreshLS() {
      const badge = document.getElementById('lsBadge');
      const content = document.getElementById('lsContent');
      badge.textContent = localStorage.length + ' ITEMS';

      if (localStorage.length === 0) {
        content.innerHTML = '<div class="empty-state">NO DATA</div>';
        return;
      }

      let html = '';
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        let display = val;
        try { display = JSON.stringify(JSON.parse(val), null, 2); } catch(e) {}
        html += '<div class="cache-entry">';
        html += '<div class="cache-key">' + key + '</div>';
        html += '<div class="cache-value">' + display.substring(0, 1500) + (display.length > 1500 ? '\n...TRUNCATED' : '') + '</div>';
        html += '</div>';
      }
      content.innerHTML = html;
    }

    function clearAllLS() {
      if (!confirm('PURGE ALL LOCALSTORAGE?')) return;
      localStorage.clear();
      showToast('LOCALSTORAGE PURGED');
      refreshNews();
      refreshLS();
    }

    function initTerminal() {
      refreshNews();
      refreshSW();
      refreshLS();
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
